id: 2abd91dc-e70a-4bd2-86ec-869bc6800658
name: Password Spray Against Entra ID From a Single IP
description: |
  One IP address fails to sign in as many different users with wrong-password
  errors within an hour. If the same IP then signs in successfully, the spray
  may have found a valid credential, and the incident should be prioritised.
severity: Medium
kind: Scheduled
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - SigninLogs
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
relevantTechniques:
  - T1110.003
query: |
  let lookback = 1h;
  let min_distinct_users = 10;
  // 50126: invalid username or password. 50053: account locked (smart lockout).
  let spray_codes = dynamic(["50126", "50053"]);
  let failures = SigninLogs
      | where TimeGenerated > ago(lookback)
      | where ResultType in (spray_codes)
      | summarize
          FailedUsers = dcount(UserPrincipalName),
          SampleUsers = make_set(UserPrincipalName, 25),
          FailedAttempts = count(),
          Apps = make_set(AppDisplayName, 10),
          FirstSeen = min(TimeGenerated),
          LastSeen = max(TimeGenerated)
          by IPAddress
      | where FailedUsers >= min_distinct_users;
  let successes = SigninLogs
      | where TimeGenerated > ago(lookback)
      | where ResultType == "0"
      | summarize SuccessfulUsers = make_set(UserPrincipalName, 25) by IPAddress;
  failures
  | join kind=leftouter successes on IPAddress
  | extend SprayFoundValidCredential = array_length(SuccessfulUsers) > 0
  | project FirstSeen, LastSeen, IPAddress, FailedUsers, FailedAttempts, SampleUsers,
            Apps, SprayFoundValidCredential, SuccessfulUsers
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress
version: 1.0.0
