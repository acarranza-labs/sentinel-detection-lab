title: PowerShell Launched With an Encoded Command
id: f1519496-36a9-45d1-80b2-62bd36161cfa
status: experimental
description: |
  Detects PowerShell started with the -EncodedCommand parameter (or one of its
  abbreviations). Attackers use base64-encoded commands to hide what the script
  does from command-line logging and from analysts.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/010/
author: Antonio Carranza
date: 2026-11-17
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense-evasion
  - attack.t1027.010
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_flag:
    CommandLine|contains:
      - ' -enc '
      - ' -enco '
      - ' -encodedcommand '
      - ' -ec '
      - ' /enc '
      - ' /encodedcommand '
  condition: all of selection_*
falsepositives:
  - Management and deployment tools (SCCM, Intune scripts, some RMM agents) that encode commands. Exclude them by parent process after baselining.
level: medium
