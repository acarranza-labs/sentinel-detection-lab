title: Volume Shadow Copy Deletion or Resize
id: a0c0d959-e33e-4263-b32a-14a7c7289535
status: experimental
description: |
  Detects deletion of Volume Shadow Copies or the backup catalog with built-in
  Windows tools. Ransomware operators do this right before encryption so the
  victim cannot restore files.
references:
  - https://attack.mitre.org/techniques/T1490/
author: Antonio Carranza
date: 2026-11-17
tags:
  - attack.impact
  - attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  selection_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains:
      - 'delete shadows'
      - 'resize shadowstorage'
  selection_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
      - 'shadowcopy'
      - 'delete'
  selection_wbadmin:
    Image|endswith: '\wbadmin.exe'
    CommandLine|contains: 'delete catalog'
  condition: 1 of selection_*
falsepositives:
  - Rare. Some backup software resizes shadow storage; verify the parent process.
level: high
